services:
  hub:
    image: wuxianpi-hub:local
    build:
      context: ../../apps/hub
      dockerfile: Dockerfile
    container_name: wuxianpi-hub
    restart: unless-stopped
    env_file:
      - ./runtime.env
      - ./secrets.env
    ports:
      - "127.0.0.1:20878:20878"
    volumes:
      - ./data:/data
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:20878/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 20s
