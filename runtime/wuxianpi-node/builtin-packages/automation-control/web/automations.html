<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高级自动化</title><style>
:root{font-family:system-ui,sans-serif;color:#17201c;background:#f6f7f8}*{box-sizing:border-box}body{margin:0}.page{width:min(900px,100%);margin:auto;padding:18px 16px 48px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}h1{font-size:24px;margin:0}.list{display:grid;gap:8px}.item{background:white;border:1px solid #d8dedb;border-radius:8px;padding:14px;display:grid;gap:8px}.meta{font-size:13px;color:#68726d;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap}.button{min-height:36px;border:1px solid #c9d0cc;border-radius:6px;padding:7px 11px;background:#fff;color:#17201c}.button.primary{background:#13795b;border-color:#13795b;color:#fff}.empty{border:1px dashed #c7cfcb;background:#fff;padding:28px;text-align:center;color:#68726d}@media(prefers-color-scheme:dark){:root,body{background:#171a18;color:#edf2ef}.item,.empty{background:#222724;border-color:#3b443f}.button{background:#252b28;color:#edf2ef;border-color:#4c5751}.button.primary{background:#2a9b76;color:#08140f}.meta,.empty{color:#aeb9b3}}
</style></head><body><main class="page"><header><h1>高级自动化</h1></header><div id="state">正在加载...</div><section id="list" class="list"></section></main><script>
let host,pending=new Map();const state=document.querySelector('#state'),list=document.querySelector('#list');addEventListener('message',e=>{if(e.data?.type==='wuxianpi_host_context'){host=e.data;load()}if(e.data?.type==='wuxianpi_bridge_response'){let p=pending.get(e.data.requestId);if(!p)return;pending.delete(e.data.requestId);e.data.ok?p.resolve(e.data.result):p.reject(new Error(e.data.error?.message||'操作失败'))}});function call(method,params={}){let id=crypto.randomUUID();return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject});parent.postMessage({type:'wuxianpi_bridge_request',requestId:id,extensionId:host.extensionId,nonce:host.nonce,method,params},'*')})}async function api(method,params={}){return call('package.invoke',{namespace:'automation-control.v1',method,params})}async function load(){try{let data=await api('list');state.hidden=true;render(data.automations||[])}catch(e){state.textContent=e.message;state.className='empty'}}function render(items){list.innerHTML='';if(!items.length){list.innerHTML='<div class="empty">没有程序自动化许可。</div>';return}for(const a of items){let el=document.createElement('article');el.className='item';el.innerHTML='<strong></strong><div class="meta"></div><div class="actions"></div>';el.querySelector('strong').textContent=a.title;el.querySelector('.meta').textContent=`${a.status} · ${a.reason} · ${a.rateUsage.used}/${a.rateUsage.limit} · 到期：${a.expiresAt}`;let actions=el.querySelector('.actions');for(const [label,method] of a.status==='pending'?[['启用自动化','approve'],['停止','revoke']]:a.status==='active'?[['暂停','pause'],['停止','revoke']]:a.status==='paused'?[['恢复','resume'],['停止','revoke']]:[]){let b=document.createElement('button');b.className='button'+(method==='approve'?' primary':'');b.textContent=label;b.onclick=async()=>{await api(method,{registrationId:a.id});load()};actions.append(b)}list.append(el)}}
</script></body></html>
